<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vishal Box Animation</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 20px;
            background-color: white;
            flex-direction: column;
        }
        
        .small-box {
            width: 200px;
            height: 200px;
            background-color: teal;
            transition: all 0.3s ease;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .big-box {
            width: 400px;
            height: 400px;
            border-radius: 50%;
            transition: all 0.3s ease;
            background-image: url("vishal.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .name {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            /* text-shadow: 2px 2px 10px black; */
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .show-name {
            opacity: 5;
            margin-top: 475px;
            color: rgb(61, 116, 130);
        }
        
        .btn {
            margin-top: 50px;
            padding: 10px 25px;
            background: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>

    <div class="small-box" id="box">
        <span id="myName" class="name">HII, I AM VISHAL SINGH </span>
    </div>

    <button class="btn">Click Me</button>


    <script>
        const box = document.getElementById("box");
        const btn = document.querySelector(".btn");
        const nameText = document.getElementById("myName");

        btn.addEventListener("click", function() {
            box.classList.toggle("big-box");
            box.classList.toggle("small-box");
            nameText.classList.toggle("show-name");
        });
    </script>

</body>

</html>
