<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Form</title>
</head>
<style>
    body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background: url(https://img.freepik.com/free-vector/gradient-abstract-wireframe-background_23-2149009903.jpg?semt=ais_incoming&w=740&q=80);
        background-size: cover;
        background-position: center;
        font-family: 'Poppins', sans-serif;
    }
    
    .form {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.5);
        padding: 120px;
        border-radius: 10px;
        color: #fff;
    }
    
    #email,
    #password {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: none;
        font-size: 15px;
    }
    
    .form h1 {
        text-align: center;
        margin-bottom: 40px;
    }
    
    h3 {
        text-align: center;
        margin-top: 20px;
        margin-bottom: 20px;
    }
    
    button {
        background-color: rgba(212, 0, 255, 0.5);
        color: white;
        padding: 10px;
        border-radius: 5px;
        border: none;
        font-size: 15px;
        width: 100%;
        margin-top: 20px;
    }
    
    .facebook {
        background-color: white;
        display: inline-block;
        color: white;
        padding: 10px;
        border-radius: 5px;
        border: none;
        font-size: 15px;
        width: 100%;
        margin-top: 20px;
        color: rgba(0, 0, 255, 0.4);
        font-weight: bold;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    .GOOGLE {
        background-color: white;
        display: inline-block;
        color: white;
        padding: 10px;
        border-radius: 5px;
        border: none;
        font-size: 15px;
        width: 100%;
        margin-top: 20px;
        color: rgba(255 0, 0);
        font-weight: bold;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    
    button:hover {
        background-color: rgb(115, 115, 156);
        cursor: pointer;
    }
</style>

<body>
    <div>
        <form class="form">
            <h1>LOGIN Form</h1>
            <br>

            <input type="email" id="email" name="email" placeholder=" Email"><br><br>

            <input type="password" id="password" name="password" placeholder=" Password"><br><br>

            <button>Login</button><br>

            <h3>Or Login With</h3>
            <button class="facebook">Facebook</button><br>
            <button class="GOOGLE">Google</button><br>

    </div>
</body>

</html>
